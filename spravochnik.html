<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#142e50" />
    <meta
      name="description"
      content="Иллюстрированный карманный справочник по ВЧО ИВЛ у новорождённых на основе обзора Задворнова и соавт."
    />
    <title>ВЧО ИВЛ — автономный карманный справочник</title>
    <link rel="stylesheet" href="css/spravochnik.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="topinner">
        <a
          class="portal-link"
          href="index.html"
          aria-label="Вернуться в главное меню"
          >← Назад</a
        ><button class="logo" onclick="go('home')" aria-label="Главная">
          <span class="logo-icon" id="brandicon"></span>ВЧО ИВЛ</button
        ><span class="topsub">Карманный справочник · Неонатология</span>
        <div class="toptools">
          <button
            class="tool"
            id="fontsize"
            onclick="fontToggle()"
            aria-label="Увеличить текст"
            aria-pressed="false"
          >
            Aа</button
          ><button
            class="tool"
            onclick="go('sources')"
            aria-label="Источники"
            id="sourceicon"
          ></button>
        </div>
      </div>
    </header>
    <div class="layout">
      <aside class="sidebar">
        <div class="side-label">Клинические задачи</div>
        <nav id="sidenav" aria-label="Разделы"></nav>
        <div class="sidefoot">
          По обзору Задворнова и соавт.<br />2026 · с. 87–96<br /><br />Редакция
          1.5<br />07 ноября 2026
        </div>
      </aside>
      <main id="main"></main>
    </div>
    <nav class="mobile-nav" aria-label="Основная навигация">
      <button id="nav-home" onclick="go('home')"></button
      ><button class="urgent" id="nav-urgent" onclick="go('urgent')"></button
      ><button id="nav-saved" onclick="go('saved')"></button
      ><button id="nav-sources" onclick="go('sources')"></button>
    </nav>
    <dialog
      id="xraydialog"
      class="xray-dialog"
      aria-label="Увеличенная рентгенограмма"
    >
      <div class="xray-dialog-head">
        <strong id="xray-modal-title"></strong
        ><button id="xray-zoom-button" onclick="zoomXray()">Увеличить ×2</button
        ><button
          onclick="document.querySelector('#xraydialog').close()"
          aria-label="Закрыть рентгенограмму"
        >
          Закрыть ✕
        </button>
      </div>
      <div class="xray-scroll">
        <img id="xray-modal-img" alt="" />
        <p class="xray-modal-caption" id="xray-modal-caption"></p>
      </div>
    </dialog>
    <div id="toast" class="toast hidden" role="status"></div>
    <script src="js/spravochnik.js"></script>
  </body>
</html>
